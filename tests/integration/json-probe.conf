
; --- nur im Integrationstest angehaengt (tests/integration/run_asterisk.sh), nicht Teil der ausgelieferten Konfiguration ---
; Prueft, ob der Dialplan eine JSON-Antwort der Bridge lesen kann (func_json, JSON_DECODE).
[lm-json-probe]
exten => s,1,Set(R=${CURL(http://127.0.0.1:18080/internal/json-probe)})
 same => n,Set(T=${JSON_DECODE(R,targets)})
 same => n,Set(G=${JSON_DECODE(R,ring)})
 same => n,Set(F=${JSON_DECODE(R,flags)})
 same => n,Set(M=${JSON_DECODE(R,moh)})
 same => n,Set(X=${CURL(http://127.0.0.1:18080/internal/json-echo?t=${URIENCODE(${T})}&g=${URIENCODE(${G})}&f=${URIENCODE(${F})}&m=${URIENCODE(${M})})})
 same => n,Hangup()

; Pegelmessung der Wartemusik: _m<N> = VOLUME(TX) -N (Teiler), _k = unveraendert; die Musik laeuft in den Local-Kanal, die Gegenseite (;1) nimmt auf
[lm-vol-probe]
exten => _m.,1,Answer()
 same => n,Set(VOLUME(TX)=-${EXTEN:1})
 same => n,MusicOnHold(default,12)
exten => _k.,1,Answer()
 same => n,MusicOnHold(default,12)

; Durchstellen mit Mitschrift (rec:) direkt pruefen: _r<Ziel ohne **> springt mit RES=rec:**<Ziel> in den Zweig recdial
[lm-rec-probe]
exten => _r.,1,Answer()
 same => n,Set(CALLUUID=lmtest-rec-${EXTEN:1})
 same => n,Set(RES=rec:**${EXTEN:1})
 same => n,Goto(from-fritz,lmtest,recdial)
