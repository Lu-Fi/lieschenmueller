; Verhalten der Test-Telefone (Ziele, die der Dialplan der App ueber PJSIP/<nr>@fritz waehlt):
;   **610  nimmt nach 1 s ab, bleibt 12 s dran, legt auf
;   **620  klingelt nur (nimmt nie ab)
;   **630  besetzt
;   0309876543  klingelt nur (Ziel fuer den Notbetrieb ohne Bridge)
[callee]
exten => **610,1,Ringing()
 same => n,Wait(1)
 same => n,Answer()
 same => n,Playtones(425)          ; laufend Audio wie ein echtes Telefon (AudioSocket bricht sonst nach 2 s Stille ab)
 same => n,Wait(12)
 same => n,Hangup()
exten => **620,1,Ringing()
 same => n,Wait(120)
 same => n,Hangup()
exten => **630,1,Busy(5)
exten => 0309876543,1,Ringing()
 same => n,Wait(120)
 same => n,Hangup()
exten => _X.,1,Hangup(1)
