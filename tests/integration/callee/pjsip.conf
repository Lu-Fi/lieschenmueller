; Gegenstelle fuer den Integrationstest ("Telefone hinter der Fritzbox"): zweite Asterisk-Instanz im selben Pod, nur 127.0.0.1:5070.
; Nimmt jede Anfrage als anonymous an (kein Netz nach draussen, keine Fritzbox).
[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5070

[anonymous]
type=endpoint
context=callee
disallow=all
allow=alaw,ulaw
direct_media=no
