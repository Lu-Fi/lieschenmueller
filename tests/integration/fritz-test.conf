; Ersatz fuer data/asterisk/fritz.conf im Integrationstest: der Endpoint "fritz" zeigt auf die Gegenstelle im selben Pod
; (127.0.0.1:5070, tests/integration/callee). Keine Anmeldung, keine echte Fritzbox, keine Zugangsdaten.
[fritz]
type=aor
contact=sip:127.0.0.1:5070

[fritz]
type=endpoint
context=from-fritz
disallow=all
allow=alaw,ulaw
aors=fritz
direct_media=no
rtp_symmetric=yes
identify_by=ip
