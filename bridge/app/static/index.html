<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Lieschen Müller</title>
<style>
:root{--bg:#eef1f6;--surface:#fff;--surface2:#f5f7fa;--line:#d5dae3;--fg:#151a23;--mut:#5a6473;--acc:#2456d3;--acc-fg:#fff;--acc-soft:#e3ebfd;
--ok:#116b36;--ok-bg:#d9f5e3;--warn:#8a4b05;--warn-bg:#fdecc8;--bad:#a61b1b;--bad-bg:#fde0e0;--info:#1a4ab8;--info-bg:#e0e9fd;--neu:#475062;--neu-bg:#e8ebf1;
--sh:#7c3aed;--sh-bg:#efe7fd;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1015;--surface:#171b23;--surface2:#1f2530;--line:#313947;--fg:#edf0f5;--mut:#9ba5b4;--acc:#6b9bf5;--acc-fg:#0a1020;--acc-soft:#1c2c4d;
--ok:#5fe08e;--ok-bg:#12331f;--warn:#fbbf4a;--warn-bg:#3b2b0b;--bad:#ff8585;--bad-bg:#3f1719;--info:#8db8ff;--info-bg:#17294b;--neu:#b3bccb;--neu-bg:#262d3a;
--sh:#b794f6;--sh-bg:#2a2142;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;margin:0;white-space:nowrap}.sw input{position:absolute;opacity:0;width:0;height:0}
.swt{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .15s}.swt::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked+.swt{background:#1a9d5a}.sw input:checked+.swt::after{left:19px}.sw input:focus-visible+.swt{outline:2px solid var(--accent,#6c9bff);outline-offset:2px}
#toasts{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;width:min(560px,calc(100vw - 24px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--acc,#6c9bff);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:11px 14px;font-size:14px;line-height:1.45;cursor:pointer;animation:tin .18s ease-out}
.toast.ok{border-left-color:#1a9d5a}.toast.bad{border-left-color:#e5484d}.toast.warn{border-left-color:#f59e0b}
.toast .td{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--acc,#6c9bff)}.toast.ok .td{background:#1a9d5a}.toast.bad .td{background:#e5484d}.toast.warn .td{background:#f59e0b}
.toast .tx{flex:1;white-space:pre-line}.toast .tc{color:var(--mut);padding-left:6px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#dlgback{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.45);padding:20px 22px;width:min(440px,100%);animation:tin .15s ease-out}
.dlg .dm{font-size:15px;line-height:1.55;white-space:pre-line}.dlg .db{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#lvb{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:8px;width:min(560px,calc(100vw - 24px))}
.lvcall{background:var(--surface);border:1px solid var(--line);border-left:5px solid #1a9d5a;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.lvhead{display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer}.lvhead>span:nth-child(2){flex:1;min-width:0}
.lvdot{width:11px;height:11px;border-radius:50%;background:#1a9d5a;animation:lvp 1.2s infinite}@keyframes lvp{0%{box-shadow:0 0 0 0 rgba(26,157,90,.6)}100%{box-shadow:0 0 0 12px rgba(26,157,90,0)}}
.lvbody{padding:2px 14px 12px;display:flex;flex-direction:column;gap:8px}.lvrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.lvrow select{flex:1;min-width:150px;width:auto}
/* Live-Banner: kleine Szenen beim Wechsel eines Anrufs (inline SVG + Keyframes). --t = schon vergangene Zeit (negativ), damit eine
   Szene nach dem Neuzeichnen des Banners an derselben Stelle weiterlaeuft statt neu zu beginnen */
.lvhead{position:relative}
.lvfx{position:absolute;right:30px;top:50%;width:104px;height:40px;margin-top:-20px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--surface) 24%);animation:lvfxio var(--d,1.8s) linear var(--t,0s) both}
.lvfx svg{display:block;width:104px;height:40px;overflow:visible}
.lvfx .l{fill:none;stroke:var(--mut);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.lvfx .f{fill:var(--surface2);stroke:var(--mut);stroke-width:1.7;stroke-linejoin:round}
.lvfx .a{fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.lvfx .af{fill:var(--acc)}.lvfx .as{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.6;stroke-linejoin:round}
.lvfx .k{fill:var(--fg)}.lvfx .ks{fill:none;stroke:var(--fg);stroke-width:1.4;stroke-linecap:round}.lvfx .hr{fill:var(--mut)}.lvfx .pf{fill:var(--surface2);stroke:var(--mut);stroke-opacity:.55;stroke-width:1.1}
.lvfx .ev0{fill:var(--surface);stroke:var(--acc);stroke-width:1.6;stroke-linejoin:round}
@keyframes lvfxio{0%{opacity:0}6%,86%{opacity:1}100%{opacity:0}}
/* eingehend: altes Telefon wackelt, Schallwellen */
.fx-ring{--d:1.7s}
.fx-ring .ph{transform-box:view-box;transform-origin:64px 35px;animation:lvwob 1.2s ease-in-out calc(var(--t,0s) + .1s) both}
.fx-ring .hs{transform-box:view-box;transform-origin:64px 22px;animation:lvhop .3s ease-in-out calc(var(--t,0s) + .1s) 3 both}
.fx-ring .w1,.fx-ring .w2{transform-box:view-box;transform-origin:64px 23px;animation:lvwave .75s ease-out calc(var(--t,0s) + .15s) 2 both}.fx-ring .w2{animation-delay:calc(var(--t,0s) + .32s)}
@keyframes lvwob{0%,72%,100%{transform:rotate(0)}8%{transform:rotate(-9deg)}17%{transform:rotate(8deg)}26%{transform:rotate(-7deg)}35%{transform:rotate(6deg)}44%{transform:rotate(-4deg)}53%{transform:rotate(3deg)}62%{transform:rotate(-1deg)}}
@keyframes lvhop{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes lvwave{0%{opacity:0;transform:scale(.75)}35%{opacity:1}100%{opacity:0;transform:scale(1.18)}}
/* durchgestellt: Hoerer fliegt im Bogen zum zweiten Telefon, Punkte-Spur */
.fx-transfer{--d:1.8s}
.fx-transfer .hs{transform:translate(90px,24px) rotate(0);animation:lvfly 1.2s linear calc(var(--t,0s) + .1s) both}
.fx-transfer .tr{transform-box:fill-box;transform-origin:center;animation:lvtrail .9s ease-out both}
.fx-transfer .tr1{animation-delay:calc(var(--t,0s) + .47s)}.fx-transfer .tr2{animation-delay:calc(var(--t,0s) + .58s)}.fx-transfer .tr3{animation-delay:calc(var(--t,0s) + .68s)}.fx-transfer .tr4{animation-delay:calc(var(--t,0s) + .77s)}.fx-transfer .tr5{animation-delay:calc(var(--t,0s) + .88s)}
.fx-transfer .pb{transform-box:fill-box;transform-origin:50% 100%;animation:lvbump .4s ease-out calc(var(--t,0s) + 1.13s) both}
.fx-transfer .ry{opacity:0;transform-box:view-box;transform-origin:90px 21px;animation:lvray .5s ease-out calc(var(--t,0s) + 1.16s) both}
@keyframes lvfly{0%{transform:translate(38px,24px) rotate(0)}8%{transform:translate(38px,24px) rotate(-12deg)}16%{transform:translate(39.5px,22px) rotate(-11deg)}24%{transform:translate(43.4px,17.3px) rotate(-10deg)}32%{transform:translate(49.2px,11.8px) rotate(-7deg)}40%{transform:translate(56.3px,7.6px) rotate(-4deg)}48%{transform:translate(64px,6px) rotate(-1deg)}56%{transform:translate(71.7px,7.6px) rotate(2deg)}64%{transform:translate(78.8px,11.8px) rotate(5deg)}72%{transform:translate(84.6px,17.3px) rotate(8deg)}80%{transform:translate(88.5px,22px) rotate(9deg)}88%{transform:translate(90px,24px) rotate(10deg)}94%{transform:translate(90px,25.2px) rotate(-2deg)}100%{transform:translate(90px,24px) rotate(0)}}
@keyframes lvtrail{0%{opacity:0;transform:scale(.2)}20%{opacity:1;transform:scale(1.3)}40%{transform:scale(1)}75%{opacity:.8}100%{opacity:0;transform:scale(1)}}
@keyframes lvbump{0%,100%{transform:scale(1)}40%{transform:scale(1.12,.88)}70%{transform:scale(.96,1.05)}}
@keyframes lvray{0%{opacity:0;transform:scale(.5)}45%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
/* KI nimmt an: Lieschen setzt das Headset auf, zwinkert, Sprechblase mit pulsierenden Punkten */
.fx-ai{--d:1.9s}
.fx-ai .hd{animation:lvset .6s ease-out calc(var(--t,0s) + .1s) both}
.fx-ai .lz{transform-box:view-box;transform-origin:46px 33px;animation:lvtilt .75s ease-in-out calc(var(--t,0s) + .7s) both}
.fx-ai .ey{transform-box:fill-box;transform-origin:center;animation:lvwink .34s ease-in-out calc(var(--t,0s) + .82s) both}
.fx-ai .bb{transform-box:view-box;transform-origin:66px 28px;animation:lvpop .35s ease-out calc(var(--t,0s) + .72s) both}
.fx-ai .d1,.fx-ai .d2,.fx-ai .d3{animation:lvdots .55s ease-in-out calc(var(--t,0s) + 1s) 2 both}.fx-ai .d2{animation-delay:calc(var(--t,0s) + 1.12s)}.fx-ai .d3{animation-delay:calc(var(--t,0s) + 1.24s)}
@keyframes lvset{0%{opacity:0;transform:translateY(-15px)}45%{opacity:1;transform:translateY(1.5px)}68%{transform:translateY(-.8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes lvtilt{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-6deg)}}
@keyframes lvwink{0%,100%{transform:scaleY(1)}35%,65%{transform:scaleY(.12)}}
@keyframes lvpop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes lvdots{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-1.6px)}}
/* Nachricht hinterlassen: Briefumschlag fliegt in den Briefkasten, Fahne geht hoch */
.fx-msg{--d:1.7s}
.fx-msg .ev{transform:translate(74.5px,15px) rotate(0);animation:lvmail 1.05s linear calc(var(--t,0s) + .05s) both}
.fx-msg .mb{transform-box:fill-box;transform-origin:50% 100%;animation:lvbump .4s ease-out calc(var(--t,0s) + .95s) both}
.fx-msg .fg{transform-box:view-box;transform-origin:90px 26.5px;animation:lvflag .45s ease-out calc(var(--t,0s) + 1.05s) both}
@keyframes lvmail{0%{opacity:0;transform:translate(34px,28px) rotate(-20deg)}8%{opacity:1}25%{transform:translate(46px,13px) rotate(-12deg)}45%{transform:translate(60px,6px) rotate(-2deg)}65%{transform:translate(68px,7px) rotate(8deg)}78%{opacity:1;transform:translate(74.5px,12px) rotate(0)}100%{opacity:1;transform:translate(74.5px,28px) rotate(0)}}
@keyframes lvflag{0%{transform:rotate(90deg)}70%{transform:rotate(-14deg)}100%{transform:rotate(0)}}
/* aufgelegt: Hoerer faellt auf die Gabel, Woelkchen, danach schrumpft die Zeile (.lvghost) */
.fx-end{--d:1.3s}
.fx-end .hs{transform:translate(64px,22.5px) rotate(0);animation:lvdrop .8s linear calc(var(--t,0s) + .05s) both}
.fx-end .pl,.fx-end .pr{opacity:0;transform-box:fill-box;transform-origin:center;animation:lvpuff .7s ease-out calc(var(--t,0s) + .4s) both}.fx-end .pl{--dx:-4px}.fx-end .pr{--dx:4px}
@keyframes lvdrop{0%{transform:translate(64px,4px) rotate(-16deg);animation-timing-function:cubic-bezier(.55,0,1,.45)}45%{transform:translate(64px,22.5px) rotate(0);animation-timing-function:ease-out}60%{transform:translate(64px,19.5px) rotate(4deg);animation-timing-function:ease-in}74%{transform:translate(64px,22.5px) rotate(0)}86%{transform:translate(64px,21.6px) rotate(0)}100%{transform:translate(64px,22.5px) rotate(0)}}
@keyframes lvpuff{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx,0px),-5px) scale(1.4)}}
.lvghost{pointer-events:none;overflow:hidden;border-left-color:var(--line);animation:lvgone .42s cubic-bezier(.4,0,.2,1) calc(var(--t,0s) + var(--gd,1.2s)) both}.lvghost.fade{--gd:0s}
.lvghost .lvdot{animation:none;background:var(--line)}.lvghost .lvhead{cursor:default}
@keyframes lvgone{0%{max-height:140px;opacity:1;transform:scale(1)}100%{max-height:0;opacity:0;transform:scale(.94);margin-bottom:-8px;border-top-width:0;border-bottom-width:0;box-shadow:none}}
.fxdemo{min-height:50px;margin-top:12px}.fxdemo .lvcall{box-shadow:none}.fxdemo .lvhead{cursor:default}.fxbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
/* "Bewegung reduzieren": keine Bewegung, nur ein ruhiges Symbol fuer die Dauer der Szene */
@media (prefers-reduced-motion:reduce){.lvfx *{animation:none!important}.lvfx{animation-name:lvstill!important}.lvghost{animation:none!important}}
@keyframes lvstill{0%,90%{opacity:1}100%{opacity:0}}
/* Assistent: Chat-Panel rechts, Knopf unten rechts mit der Helferin "Lieschen" (eigenes Design: Kopf mit Headset aus den Banner-Szenen) */
#asst{position:fixed;top:58px;right:0;bottom:0;z-index:35;width:min(430px,100vw);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 34px rgba(0,0,0,.22);animation:asin .18s ease-out}
@keyframes asin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
#asst .ashead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}#asst .ashead b{font-size:15px}#asst .ashead .sp{flex:1}
#asst .asmsgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.asm{max-width:92%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.asm.u{align-self:flex-end;background:var(--acc-soft);color:var(--fg);border-bottom-right-radius:4px}.asm.m{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.asm.err{background:var(--bad-bg);color:var(--bad)}.asm .astools{display:block;font-size:11.5px;color:var(--mut);margin-top:4px}
.ascard{align-self:stretch;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:13.5px}
.ascard table{margin:6px 0;font-size:13px}.ascard td,.ascard th{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-transform:none;letter-spacing:0}.ascard .ar{color:var(--mut)}
.ascard .aswarn{border-left:3px solid var(--warn);background:var(--warn-bg);color:var(--warn);padding:6px 8px;border-radius:6px;margin:6px 0;font-size:12.5px}
.ascard.done{border-left-color:#1a9d5a}.ascard.gone{opacity:.6;border-left-color:var(--line)}.ascard .asbtn{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
#asst .asin{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}#asst textarea{flex:1;resize:none;min-height:42px;max-height:140px;font:inherit;font-size:14px}
#asst .aslog{border-top:1px solid var(--line);padding:6px 14px 10px;font-size:13px;max-height:34vh;overflow:auto}#asst .aslog summary{cursor:pointer;color:var(--mut);padding:4px 0}
.aschg{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}.aschg .t{flex:1;min-width:0}.aschg .t small{color:var(--mut);display:block}
#lzfab{position:fixed;right:18px;bottom:18px;z-index:34;width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:0 6px 22px rgba(0,0,0,.25);cursor:pointer;padding:0;display:grid;place-items:center}
#lzfab:hover{border-color:var(--acc)}#lzfab:focus-visible{outline:2px solid var(--acc);outline-offset:3px}#lzfab .lzh{width:56px;height:51px;margin-left:4px}
#lztip{position:fixed;right:88px;bottom:30px;z-index:34;max-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.25);padding:10px 30px 10px 12px;font-size:13.5px;animation:tin .2s ease-out}
#lztip button{position:absolute;top:4px;right:6px;background:none;border:0;color:var(--mut);font-size:15px;cursor:pointer}
#lztip:after{content:"";position:absolute;right:-7px;bottom:16px;width:12px;height:12px;background:var(--surface);border-right:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.lzh{display:block;overflow:visible}.lzh .f{fill:var(--surface2);stroke:var(--mut);stroke-width:1.5}.lzh .hr{fill:var(--mut)}.lzh .k{fill:var(--fg)}.lzh .ks{fill:none;stroke:var(--fg);stroke-width:1.3;stroke-linecap:round}
.lzh .a{fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round}.lzh .af{fill:var(--acc)}.lzh .as{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.3}
.lzh .lzt,.lzh .lzmo2,.lzh .lzbr,.lzh .lzfr{opacity:0}.lzh .lzey,.lzh .lzhd,.lzh .lzmo2,.lzh .lzw{transform-box:fill-box;transform-origin:center}
.lzh .lzhd{animation:lzbreath 4.2s ease-in-out infinite}.lzh .lzey{animation:lzblink 5.5s infinite}
@keyframes lzbreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5px)}}
@keyframes lzblink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.lzh.s-think .lzey{animation:none;transform:translate(.6px,-1.3px)}.lzh.s-think .lzt{opacity:1}.lzh.s-think .lzd{animation:lvdots .9s ease-in-out infinite}.lzh.s-think .lzd2{animation-delay:.15s}.lzh.s-think .lzd3{animation-delay:.3s}
.lzh.s-talk .lzmo{opacity:0}.lzh.s-talk .lzmo2{opacity:1;animation:lztalk .2s ease-in-out 7 alternate}
@keyframes lztalk{from{transform:scaleY(1)}to{transform:scaleY(.25)}}
.lzh.s-nod .lzhd{transform-box:view-box;transform-origin:20px 30px;animation:lznod .9s ease-in-out 1}.lzh.s-nod .lzw{animation:lvwink .4s ease-in-out .3s 1}
@keyframes lznod{0%,100%{transform:rotate(0)}25%{transform:translateY(1.2px) rotate(-5deg)}55%{transform:translateY(0) rotate(-5deg)}}
.lzh.s-worry .lzbr,.lzh.s-worry .lzfr{opacity:1}.lzh.s-worry .lzmo{opacity:0}.lzh.s-worry .lzey{animation:none;transform:translateY(.5px)}
#asst .ashead .lzh{width:54px;height:49px;flex:none}
@media (prefers-reduced-motion:reduce){.lzh *{animation:none!important}#asst,#lztip{animation:none}}
@media (max-width:600px){#asst{top:0;width:100vw;z-index:45}#lzfab{right:12px;bottom:12px}}
header{position:sticky;top:0;z-index:5;display:flex;gap:20px;align-items:center;padding:0 24px;height:58px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center;font-size:16px}
.wm{display:inline-flex;flex-direction:column;justify-content:center;line-height:1;padding-left:10px;border-left:3px solid var(--acc);border-radius:2px;user-select:none}

// eine Zeile der Anrufliste (cls: zusaetzliche Klasse, z. B. eingerueckt in einer Gruppe)
const callRow=(x,cls)=>`<tr class="c${cls||""}" onclick="sel=${x.id};render()"><td>${fmt(x.started)}</td><td>${x.caller_name?`<b>${esc(x.caller_name)}</b><div class=num style="font-size:12px">${esc(x.caller)}</div>`:`<span class=num>${esc(x.caller)}</span>`}${x.caller_info?`<div class=mut style="font-size:12px">${esc(x.caller_info)}</div>`:""}${dayNth(x)}</td><td class=num>${esc(x.called)}${isAdmin()&&x.owner_name?`<div class="ownr${x.owner_shared?" shared":""}" style="font-size:12px;font-weight:600;margin-top:2px">● ${esc(x.owner_name)}${x.owner_shared?" (geteilt)":""}</div>`:""}</td><td>${agentCell(x)}</td><td class=mut>${dur(x)}</td>${isAdmin()?`<td class=num>${money(x.cost_usd)}</td>`:""}<td>${statusBadge(x.status)}${x.recording?" "+badge("Aufnahme","info"):""}${x.archived?" "+badge("★ Archiv","warn"):""}${x.memo?" "+badge("Notiz","neu"):""}</td></tr>`;
// Gruppierung (Schalter, nur Anzeige): aufeinanderfolgende eingehende Anrufe derselben Nummer am selben Tag mit hoechstens 30 Minuten
// Abstand werden zu einer Zeile zusammengefasst; ein Klick klappt sie auf. Gruppen enden an der Seitengrenze.
let GROUP=(()=>{try{return localStorage.getItem("lgroup")==="1"}catch(e){return false}})();
const GOPEN=new Set();
function setGroup(on){GROUP=on;try{localStorage.setItem("lgroup",on?"1":"0")}catch(e){};list()}
function toggleGrp(k){GOPEN.has(k)?GOPEN.delete(k):GOPEN.add(k);list()}
function callGroups(c){
 const out=[];
 for(const x of c){
  const g=out[out.length-1],p=g&&g[g.length-1];
  const same=p&&x.num_key&&p.num_key===x.num_key&&new Date(p.started*1000).toDateString()===new Date(x.started*1000).toDateString()&&Math.abs(p.started-x.started)<=1800;
  same?g.push(x):out.push([x]);
 }
 return out;
}
// aufgeklappter Anruf einer Gruppe: kompakt, nur Uhrzeit (Name/Nummer stehen in der Kopfzeile), Streifen und Hintergrund wie die Gruppe
function subRow(x,last){
 const hm=new Date(x.started*1000).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
 return `<tr class="c gsub${last?" gend":""}" onclick="sel=${x.id};render()"><td class=mut>└ ${hm}</td><td></td><td class=num>${esc(x.called)}</td><td>${agentCell(x)}</td><td class=mut>${dur(x)}</td>${isAdmin()?`<td class=num>${money(x.cost_usd)}</td>`:""}<td>${statusBadge(x.status)}${x.recording?" "+badge("Aufnahme","info"):""}${x.archived?" "+badge("★ Archiv","warn"):""}${x.memo?" "+badge("Notiz","neu"):""}</td></tr>`;
}
function listRows(c){
 if(!GROUP)return c.map(x=>callRow(x)).join("");
 const hm=t=>new Date(t*1000).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
 return callGroups(c).map(g=>{
  if(g.length<2)return callRow(g[0]);
  const x=g[0],k=x.id,open=GOPEN.has(k),last=g[g.length-1];
  const st=[...new Set(g.map(y=>y.status))].map(y=>statusBadge(y)).join(" ");
  return `<tr class="c grp${open?" gopen":""}" onclick="toggleGrp(${k})"><td>${fmt(x.started)}</td><td>${x.caller_name?`<b>${esc(x.caller_name)}</b><div class=num style="font-size:12px">${esc(x.caller)}</div>`:`<span class=num>${esc(x.caller)}</span>`}<div style="margin-top:3px">${badge(`${g.length} Anrufe ${hm(last.started)}–${hm(x.started)}`,"rep")}</div></td><td colspan=${isAdmin()?4:3} class=mut>${open?"▾ zuklappen":"▸ aufklappen"}</td><td>${st}</td></tr>`+(open?g.map((y,i)=>subRow(y,i===g.length-1)).join(""):"");
 }).join("");
}

function fxTrack(items){
 const now=Date.now(),ids=new Set();
 items.forEach((c,i)=>{
  ids.add(c.id);lvGhost.delete(c.id);           // wieder da (z. B. durchgestellt und angenommen): Geist-Zeile entfaellt
  const e=lvFx.get(c.id)||{},st=fxState(c),msg=c.msg||0;let scene=null;
  if(e.st!==st){
   if(st!=="human")scene=st;                     // klingelt / KI nimmt an / KI stellt durch
   else if(e.st==="ai"||e.st==="ring")scene="transfer";      // ein Mensch hat uebernommen
  }else if(st==="ai"&&msg>(e.msg||0))scene="msg";            // note_message: Nachricht aufgenommen
  Object.assign(e,{st,msg,item:c,idx:i,seen:now,gone:false});
  if(scene&&lvFxReady&&FXON)Object.assign(e,{scene,t0:now});
  lvFx.set(c.id,e);
 });
 for(const [id,e] of lvFx){
  if(ids.has(id))continue;
  if(!e.gone){
   e.gone=true;e.scene=null;
   if(lvFxReady&&FXON&&e.item){                  // Zeile verschwindet: kurz als "Geist" stehen lassen (aufgelegt bzw. weich ausblenden)

 }

let liveES=null,liveBeat=0,liveFirst=true;
function liveStart(){
 if(liveES){try{liveES.close()}catch(e){}}
 const es=liveES=new EventSource("/api/live/stream");
 liveBeat=Date.now();
 es.onopen=()=>{liveBeat=Date.now();if(!liveFirst&&typeof listLater==="function")listLater();liveFirst=false};
 es.onmessage=e=>{liveBeat=Date.now();try{liveRender(JSON.parse(e.data))}catch(x){}};
 es.addEventListener("ping",()=>{liveBeat=Date.now()});
 es.addEventListener("logout",()=>{es.close();location.href="/login"});
 es.onerror=async()=>{es.close();if(liveES!==es)return;
  try{const r=await fetch("/api/status",{cache:"no-store"});if(r.status===401){location.href="/login";return}}catch(x){}
  setTimeout(()=>{if(liveES===es)liveStart()},3000)};
}

const digits=t=>String(t).replace(/\D/g,"");
function acMatches(q){
 q=q.trim().toLowerCase();if(!q)return contactList.slice(0,8);
 const qd=digits(q),out=[];
 for(const c of contactList){
  const n=c.name.toLowerCase(),i=n.indexOf(q);
  const score=i===0?0:n.split(/\s+/).some(w=>w.startsWith(q))?1:i>0?2:(qd.length>=3&&digits(c.number).includes(qd))?3:-1;
  if(score>=0)out.push([score,c]);
 }
 return out.sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name)).slice(0,8).map(x=>x[1]);
}

  // mit Gruppen (z. B. Intern / Kontakte): je Gruppe hoechstens 6, in der Reihenfolge der Quelle
  shown=hit.some(o=>o.g)?[...new Set(hit.map(o=>o.g))].flatMap(g=>hit.filter(o=>o.g===g).slice(0,6)):hit.slice(0,8);
  const free=q&&!shown.some(o=>o.v.toLowerCase()===q)?[{v:input.value.trim(),l:"„"+input.value.trim()+"“ übernehmen",s:"als Nummer oder Name",free:true}]:[];
  shown=[...shown,...free];act=Math.min(act,Math.max(0,shown.length-1));
  if(!shown.length){hide();return}
  tagOwner=me;
  list.innerHTML=shown.map((o,i)=>(o.g&&(i===0||shown[i-1].g!==o.g)?`<div class=cs-hd>${esc(o.g)}</div>`:"")+`<div class="cs-opt${i===act?" act":""}" data-i="${i}"><span><b>${esc(o.l)}</b></span><span class=hint style="white-space:nowrap">${esc(o.s)}</span></div>`).join("");
  me.place();list.hidden=false;

  if(e.key==="ArrowDown"){e.preventDefault();act=Math.min(act+1,shown.length-1);show()}

 box.addEventListener("click",e=>{if(e.target===box)input.focus()});
 input._commit=()=>add(input.value);
 render();
 if(lists&&Date.now()-tagSrc.t>=30000){

 }

  if(m.type==="call"||m.type==="end")liveBar();

  if(tab!=="calls")return;

  if(!sel&&(m.type==="call"||m.type==="end"))return listLater();
  if(sel!==m.call_id)return;
  if(m.type==="segment"){const c=$("#segs");if(c){c.querySelector(".empty")?.remove();c.insertAdjacentHTML("beforeend",seg(m));c.scrollTop=c.scrollHeight}}
  else if(m.type==="note"){const n=$("#notes");if(n){n.hidden=false;n.innerHTML=notesHtml(m.notes)}}
  else if(m.type==="usage"){const b=$("#costb");if(b)b.textContent=money(m.cost)}

async function astSave(){

 const warn=n?`⚠️ Es ${n===1?"läuft":"laufen"} gerade ${n} Telefonat${n===1?"":"e"} (oder es klingelt). Beim Ändern meldet sich Asterisk eventuell kurz neu an, ${n===1?"das Gespräch könnte":"die Gespräche könnten"} dabei unterbrochen werden.\n\n`:"";

async function setNumber(num,ids){

let RP={box:"",base:"",rules:[],numbers:[],actions:{},modes:{}};
const RA=k=>[LBL.dialrule_actions[k]||k,LBL.dialrule_action_hints[k]||""].filter(Boolean).join(" ");      // Texte: GET /api/labels
function ruleText(r){
 const who=r.caller_mode==="list"?"Anrufer "+r.callers.join(", "):LBL.dialrule_modes[r.caller_mode];
 const d=!r.days.length||r.days.length===7?"täglich":r.days.map(i=>DAYN[i]).join(", ");
 const when=(r.days.length||r.from)?`, ${d}${r.from?` ${r.from}–${r.to}`:""}`:"";
 const nums=r.called.length?`, nur Nummer ${r.called.join(", ")}`:"";
 return `Wenn ${who}${when}${nums} → <b>${RA(r.action).replace(" …","")}${r.action==="forward"?" "+esc(r.target):""}</b>${r.note?` (${esc(r.note)})`:""}`;
}
async function loadRules(box,base){
 RP.box=box;RP.base=base;
 const d=await api(base);
 if(!d.rules){$("#"+box).innerHTML=`<div class=hint>${esc(d.detail||"Regeln nicht verfügbar")}</div>`;return}

 const box=$("#"+RP.box);if(!box)return;
 box.innerHTML=(RP.rules.length?RP.rules.map((r,i)=>`<div class="rrow ${r.enabled?"":"off"}"><label class=switch title="${r.enabled?"Regel ist an – zum Ausschalten klicken":"Regel ist aus – zum Einschalten klicken"}"><input type=checkbox ${r.enabled?"checked":""} onchange="toggleRule('${esc(r.id)}',this.checked)"><span></span></label>
  <div class=rmain><b>${esc(r.name)}</b><div class=hint style="margin:2px 0 0">${ruleText(r)}</div></div>
  <div class=rbtn><button class=s title="nach oben" ${i?"":"disabled"} onclick="moveRule(${i},-1)">↑</button><button class=s title="nach unten" ${i<RP.rules.length-1?"":"disabled"} onclick="moveRule(${i},1)">↓</button><button class=s onclick="editRule(${i})">Bearbeiten</button><button class=d onclick="delRule(${i})" title="Regel löschen">✕</button></div></div>`).join(""):`<div class=hint style="margin-bottom:8px">Noch keine Regeln.</div>`)+

const RPRE={unknown:{name:"Unbekannte zum Anrufbeantworter",caller_mode:"unknown",action:"ai",note:"bitte Nachricht hinterlassen"},

async function toggleRule(id,on){
 const r=await fetch(`${RP.base}/${id}/toggle`,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({enabled:on})});

}
async function putRules(list){

}
function moveRule(i,d){const l=[...RP.rules],j=i+d;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];putRules(l)}

 <label>Notiz (Freitext, darf der Anrufbeantworter nennen)</label><input id=re_note value="${esc(r.note)}" placeholder="z. B. Mittagspause, bitte Nachricht hinterlassen">
 <div class=actions><button class=p onclick="saveRule(${i})">Speichern</button><button class=s onclick="drawRules()">Abbrechen</button></div></div>`;
 reVis();initTag("re_callers","caller");initTag("re_target","caller",true);$("#redit").scrollIntoView({behavior:"smooth",block:"nearest"});
}

async function saveRule(i){

  days:[...document.querySelectorAll("[data-rd]")].filter(c=>c.checked).map(c=>+c.dataset.rd),from:$("#re_from").value,to:$("#re_to").value,

function helpSearch(q){HELPQ=q;HELPOPEN="";helpBody();document.querySelectorAll(".hmenu a").forEach(a=>a.classList.toggle("on",!q&&((a.getAttribute("href")==="#/help"&&!(typeof sel==="string"))||a.getAttribute("href")==="#/help/"+sel)))}
function helpBody(){
 const {START,TOPICS}=HELPMOD,box=$("#hbody");if(!box)return;
 const words=hWords(HELPQ),cur=typeof sel==="string"?sel:"";
 if(words.length&&!(HELPOPEN&&cur===HELPOPEN)){
  const res=TOPICS.map(t=>{const text=hStrip(t.html),low=text.toLowerCase(),title=t.title.toLowerCase(),keys=(t.keys||"").toLowerCase();
   if(!words.every(w=>low.includes(w)||title.includes(w)||keys.includes(w)))return null;
   let score=0;for(const w of words){if(title.includes(w))score+=10;if(keys.includes(w))score+=5;score+=Math.min(5,low.split(w).length-1)}
   const i=Math.max(0,low.indexOf(words[0])),sn=text.slice(Math.max(0,i-60),i+140);
   return {t,score,sn:(i>60?"… ":"")+sn+"…"}}).filter(Boolean).sort((a,b)=>b.score-a.score);
  box.innerHTML=`<div class=hint style="margin:0 0 8px">${res.length?res.length+" Treffer":"Kein Treffer"} für „${esc(HELPQ)}“</div>`+res.map(r=>`<a class=hres href="#/help/${r.t.id}" onclick="HELPOPEN='${r.t.id}'"><div class=rg>${esc(r.t.group)}</div><b>${hMark(esc(r.t.title),words)}</b><div class=sn>${hMark(esc(r.sn),words)}</div></a>`).join("")+(res.length?"":`<p class=mut>Versuche andere Wörter oder einen Teil davon, zum Beispiel „aufnahme“, „musik“ oder „99613“.</p>`);
  return}
 const t=TOPICS.find(x=>x.id===cur),hl=h=>words.length?hMark(h,words):h;
 const back=words.length&&t?`<a href="#/help" onclick="HELPOPEN='';helpBody();return false" style="font-size:13px">← zurück zu den Treffern für „${esc(HELPQ)}“</a>`:"";
 box.innerHTML=t?`${back}<h2 style="margin:${back?"10px":"0"} 0 4px">${esc(t.title)}</h2><div class=mut style="font-size:12.5px;margin-bottom:12px">${esc(t.group)}</div>${hl(t.html)}`:START;
 window.scrollTo({top:0})
}

let presTimer=null;
async function presState(){
 clearTimeout(presTimer);const sel=$("#m_pres_mac"),box=$("#m_pres_state");if(!sel||!box)return;
 const mac=sel.value;if(!mac){box.innerHTML="";return}
 let r;try{r=await api("/api/fritz/host-status?mac="+encodeURIComponent(mac))}catch(e){r={active:null}}
 if(!$("#m_pres_mac")||$("#m_pres_mac").value!==mac)return;
 const d=r.devices||{},n=Object.keys(d).length;
 box.innerHTML=(r.active===true?badge(n>1?"Anwesend: mindestens ein Gerät ist im Netz":"Gerät ist gerade im Netz","ok"):r.active===false?badge(n>1?"Kein Gerät im Netz":"Gerät ist gerade nicht im Netz","neu"):badge("Fritzbox nicht erreichbar","warn"))
  +(n>1?`<div class=hint style="margin-top:4px">${Object.entries(d).map(([m,a])=>`${esc(m)}: ${a===true?"im Netz":a===false?"nicht im Netz":"?"}`).join(" · ")}</div>`:"");
 presTimer=setTimeout(presState,20000);
}

function cardGroup(c){const n=cardTitle(c);const g=SGROUPS.find(g=>g[1].some(x=>n.startsWith(x)));return g?g[0]:"Weitere"}
function settingsGroupNow(){if(window._sg)return window._sg;let g="";try{g=localStorage.getItem("setgrp")||""}catch(e){}return g||"Allgemein"}
function settingsNav(){
 const nav=$("#snav_c");if(!nav)return;
 const cards=settingsCards();
 cards.forEach((c,i)=>{c.id=c.id||"sc"+i});
 const names=[...SGROUPS.map(g=>g[0])];if(cards.some(c=>cardGroup(c)==="Weitere"))names.push("Weitere");
 let cur=settingsGroupNow();if(!names.includes(cur))cur=names[0];window._sg=cur;
 nav.innerHTML=names.map(g=>`<button data-g="${g}" class="${g===cur?"on":""}" onclick="settingsGroup('${g}')">${g}<span class=cnt>${cards.filter(c=>cardGroup(c)===g).length}</span></button>`).join("");
 if(!window._snavObs){window._snavObs=new MutationObserver(()=>{clearTimeout(window._snavT);window._snavT=setTimeout(()=>{if($("#snav_c"))settingsNav()},150)})}
 window._snavObs.disconnect();
 ["connset","holdset","gcalset","anomset"].forEach(id=>{const e=$("#"+id);if(e)window._snavObs.observe(e,{childList:true})});
 settingsFilter();
}
function settingsGroup(g){window._sg=g;try{localStorage.setItem("setgrp",g)}catch(e){}const q=$("#snav_q");if(q)q.value="";settingsNav()}
function settingsFilter(){
 const q=(($("#snav_q")||{}).value||"").trim().toLowerCase(),cards=settingsCards();let n=0;
 const g=window._sg||"Allgemein";
 cards.forEach(c=>{
  const ok=q?(c.textContent.toLowerCase().includes(q)||[...c.querySelectorAll("input,textarea")].some(x=>(x.value||"").toLowerCase().includes(q)||(x.placeholder||"").toLowerCase().includes(q))):cardGroup(c)===g;
  c.style.display=ok?"":"none";if(ok)n++});
 document.querySelectorAll("#snav_c button").forEach(a=>{a.classList.toggle("on",!q&&a.dataset.g===g)});
 const none=$("#snav_none");if(none)none.style.display=q&&!n?"":"none";
}
function settingsNavKey(e){
 if(e.key==="Escape"){e.target.value="";settingsFilter()}
}

 <label class=chk><input type=checkbox id=s_outany ${st.rec_out_any?"checked":""}> Auch ausgehende Gespräche <b>ohne</b> Vorwahl mitschreiben, die über Asterisk laufen</label>
 <div class=hint>Das sind Rückrufe aus der Anrufliste eines Telefons (der Anruf kam über eine Klingel-Rufnummer 99… herein) und Telefone, deren ausgehende Rufnummer in der Fritzbox eine Klingel-Rufnummer ist. Es gelten dann dieselben Regeln wie mit Vorwahl. Aus (Standard): nur wer bewusst die Vorwahl wählt, wird mitgeschrieben. ⚠ Läuft ein Telefon ausgehend immer über Asterisk, kann es bei einem Ausfall von Asterisk nicht mehr nach draußen telefonieren. Und: Gespräche ohne Wissen des Gesprächspartners aufzuzeichnen, kann strafbar sein – die Hinweis-Ansage der Regel gehört dann eingeschaltet.</div>

 <input id=s_ringall value="${esc(st.ring_all)}" style="width:150px" placeholder="99613" title="Klingel-Rufnummer 99…, die in der Fritzbox allen Telefonen zugewiesen ist, die klingeln sollen – z. B. die des Empfangs (99611 für **611). Mehrere mit +, leer = aus. Asterisk richtet sie selbst ein. Zeigt die Fritzbox-Wahlregel für aufgezeichnete Gespräche auf eine andere 99…, muss jene ebenfalls eingeschaltet bleiben.">
 <div class=hint>Ist ein Agent aktiv (und es wird kein bestimmter Benutzer angerufen), nimmt Asterisk den Anruf an, lässt <b>alle Telefone</b> über diese Rufnummer klingeln (so lange, wie bei der Anrufregel unter „Klingeln“ steht) und übernimmt dann mit der KI. Hebt jemand ab, wird je nach Aufzeichnungsregel aufgezeichnet und transkribiert. Die Rufnummer muss in der Fritzbox allen Telefonen zugewiesen sein, die klingeln sollen (z. B. <b>99613</b> oder die Klingel-Rufnummer des Empfangs, etwa 99611); Asterisk richtet sie dafür von selbst ein, und sie lässt sich unter „Anruferanzeige an den Telefonen“ erst ausschalten, wenn hier eine andere steht. <b>Leer</b> = es werden keine Telefone über diese Funktion angeklingelt. Ohne Wartemusik klingelt dann die Fritzbox selbst, wie früher. <b>Mit eingeschalteter Wartemusik</b> nimmt Asterisk den Anruf selbst an und spielt die Musik, bis die KI nach der Zeit aus der Anrufregel übernimmt (kein Telefon klingelt, die Rufnummer muss in der Fritzbox nur dem Asterisk-Gerät zugewiesen sein).</div>

 <label class=sw style="margin:12px 0 2px"><input type=checkbox id=s_ringmusic ${st.ring_music?"checked":""}><span class=swt></span> Statt des Freizeichens Wartemusik spielen, während die Telefone klingeln</label>

 <div class=hint>Die Handsets zeigen weiter den Namen aus dem Telefonbuch, die Fritzbox gleicht die Nummern ab. Eine andere Schreibweise vermeidet, dass sie den zweiten Anruf als „denselben Anrufer“ behandelt. Nur ändern, wenn nötig.</div>
 <label>Welche Musik beim Klingeln?</label>
 ${trackSel("s_ringtrack",st.ring_track,tracks)}

async function holdUpload(){
 const files=[...($("#h_file").files||[])],m=$("#h_umsg");
 if(!files.length){m.textContent="Bitte zuerst eine Datei wählen.";return}
 $("#h_up").disabled=true;let ok=0;
 for(const f of files){
  m.innerHTML=SPIN+`„${esc(f.name)}“ wird hochgeladen und umgerechnet …`;
  const data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]||"");fr.onerror=rej;fr.readAsDataURL(f)});
  const r=await fetch("/api/hold-tracks",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:f.name,data})}),j=await r.json().catch(()=>({}));
  if(!r.ok){m.textContent=`„${f.name}“: ${j.detail||"Fehler"}`;$("#h_up").disabled=false;if(ok)holdSettings();return}
  ok++;
 }
 toast(ok===1?"Stück hinzugefügt.":ok+" Stücke hinzugefügt.");holdSettings();
}

let CONN_HOST="";
async function busyNote(){      // laufende Telefonate: Warnung fuer Aenderungen, bei denen sich Asterisk neu anmeldet
 const lv=await fetch("/api/live").then(r=>r.ok?r.json():null).catch(()=>null);
 const n=lv?(lv.calls||[]).length+(lv.ringing||[]).length:0;
 return {n,warn:n?`⚠️ Es ${n===1?"läuft":"laufen"} gerade ${n} Telefonat${n===1?"":"e"} (oder es klingelt). Asterisk lädt dabei seine Konfiguration neu und meldet sich bei der Fritzbox neu an; ${n===1?"das Gespräch könnte":"die Gespräche könnten"} dabei unterbrochen werden.\n\n`:""};
}
async function connSave(keys){
 const body={};for(const k of keys){const e=$("#cf_"+k);if(!e)continue;body[k]=e.value}
 if("fritz_host" in body&&body.fritz_host.trim()!==CONN_HOST){
  // Die Adresse gilt auch fuer die Anmeldung von Asterisk: erst nachfragen, bei laufenden Telefonaten ausdruecklich
  const {n,warn}=await busyNote();
  if(!await askConfirm(warn+`Fritzbox-Adresse auf „${body.fritz_host.trim()||"(leer)"}“ ändern? Asterisk meldet sich dann an dieser Adresse neu an.`+(n?"\n\nTrotzdem jetzt ändern?":""),n?{yes:"Ja, trotzdem ändern",no:"Nein",danger:true}:{yes:"Ja, ändern",no:"Nein"}))return;
  body.force=n>0;
 }
 const r=await fetch("/api/config",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));
 if(!r.ok)return toast(j.detail||"Fehler beim Speichern");
 toast("Gespeichert.");connSettings();
}

}

let SETUP=null,SETUP_CFG=null,SETUP_STEP=null,setupTimer=null;
const SETUP_STEPS=[["gemini","Google Gemini"],["fritz","Fritzbox"],["sip","IP-Telefon"],["numbers","Rufnummern"],["done","Abschluss"]];
const tipI=t=>`<span class=tipi tabindex=0 title="${esc(t)}" aria-label="${esc(t)}">?</span>`;
const SIP_PW_OK=/^[A-Za-z0-9._-]{8,64}$/;
async function setupLoad(check){try{const r=await fetch("/api/setup"+(check?"?check=1":""));if(r.ok)SETUP=await r.json()}catch(e){}return SETUP}
function setupMissing(){const s=(SETUP&&SETUP.steps)||{},m=[];if(!s.gemini)m.push("Gemini-Zugang");if(!s.fritz)m.push("Fritzbox-Zugang");if(!s.sip)m.push("IP-Telefon");else if(!s.registered)m.push("Asterisk nicht angemeldet");return m}
function setupStepOk(k){
 const s=(SETUP&&SETUP.steps)||{};
 if(k==="gemini")return !!s.gemini;if(k==="fritz")return !!s.fritz;if(k==="sip")return !!(s.sip&&s.registered);
 if(k==="numbers")return !!(astData&&(astData.numbers||[]).some(n=>n.on));
 return !!(SETUP&&SETUP.complete);
}
function paintSetupBar(){
 const b=$("#setupbar");if(!b)return;const s=SETUP;
 const on=isAdmin()&&s&&!s.complete&&!s.done_once&&!s.dismissed&&tab!=="setup";
 b.innerHTML=on?`<div class=setupbar><span>Die Einrichtung ist noch nicht abgeschlossen (fehlt: ${esc(setupMissing().join(", "))}).</span><button class=p onclick="setupOpen()">Einrichtungsassistent öffnen</button><button class=s onclick="setupLater()" title="Hinweis ausblenden. Der Assistent bleibt unter Einstellungen → Allgemein erreichbar.">Später</button></div>`:"";
}
async function setupBoot(h0){       // beim Laden der Seite: Assistent von selbst zeigen, solange die Einrichtung unvollstaendig ist
 await setupLoad();
 if(SETUP&&SETUP.show&&(!h0||h0==="#/"||h0==="#/calls")&&tab==="calls"&&!sel){tab="setup";render()}
 else paintSetupBar();
}
function setupOpen(step){SETUP_STEP=step??null;tab="setup";sel=null;closeMenu();render()}
async function setupLater(){
 await fetch("/api/setup",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({dismissed:true})});
 if(SETUP)SETUP.dismissed=true;
 toast("Ausgeblendet. Den Assistenten findest du jederzeit unter Einstellungen → Allgemein → Einrichtungsassistent.");
 if(tab==="setup"){tab="calls";sel=null;render()}else paintSetupBar();
}
function setupFinish(){
 clearInterval(setupTimer);setupTimer=null;
 toast(SETUP&&SETUP.complete?"Einrichtung abgeschlossen. Jetzt einen Testanruf machen!":"Noch offen: "+setupMissing().join(", ")+". Der Assistent bleibt unter Einstellungen → Allgemein erreichbar.");
 tab="calls";sel=null;render();
}
function setupPills(){
 return SETUP_STEPS.map(([key,name],i)=>{const ok=setupStepOk(key);return `<button class="wzs ${i===SETUP_STEP?"on":""} ${ok?"ok":""}" onclick="setupGo(${i})" title="Schritt ${i+1}: ${name}${ok?" (erledigt)":""}" ${i===SETUP_STEP?'aria-current="step"':""}><span class=wzn>${ok?"✓":i+1}</span>${name}</button>`}).join("");
}
function setupRepaint(){const p=$("#wzsteps");if(p)p.innerHTML=setupPills();const r=$("#wz_reg");if(r&&SETUP)r.innerHTML=setupRegHtml(SETUP)}
function setupGo(i){SETUP_STEP=i;setupView()}

  <small>${(c.diff||[]).map(d=>`${esc(d.feld)}: ${esc(d.vorher)} → ${esc(d.nachher)}`).join("; ")}</small></div>
  ${c.undone_ts?"":`<button class=s onclick="asstUndo(${c.id})" title="Stellt den Stand vor dieser Änderung wieder her (über dieselbe Speicherlogik). Geht nicht mehr, wenn dort inzwischen etwas anderes geändert wurde.">Rückgängig</button>`}</div>`).join("");
}
async function asstChanges(){
 const box=$("#aschg");if(!box)return;
 try{box.innerHTML=asstChgHtml(await api("/api/assistant/changes?limit=15"),isAdmin())}catch(e){box.textContent="Nicht lesbar"}
}
async function asstUndo(id){
 if(!await askConfirm("Diese Änderung rückgängig machen? Der vorherige Stand wird wiederhergestellt."))return;
 const r=await post(`/api/assistant/changes/${id}/undo`),j=await r.json().catch(()=>({}));
 if(!r.ok){lzState("worry",3000);return toast(j.detail||"Rückgängig fehlgeschlagen")}
 toast("Rückgängig gemacht","ok");asstChanges();asstLogLoad();
 if(["rules","account","staff"].includes(tab))render();
 paintMyStat();
}
async function asstLogLoad(){
 const box=$("#asstlog");if(!box)return;
 try{box.innerHTML=asstChgHtml(await api("/api/assistant/changes?limit=50"),true)}catch(e){box.textContent="Nicht lesbar"}
}

async function asstSettingsSave(){
 const r=await fetch("/api/settings",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({assistant_on:$("#s_aon").checked,assistant_model:$("#s_amodel").value})}),j=await r.json().catch(()=>({}));
 $("#s_amsg").textContent=r.ok?"Gespeichert.":(j.detail||"Fehler");
 if(r.ok)asstInit();
}
