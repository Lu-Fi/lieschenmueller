<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Anmelden – Lieschen Müller</title>
<style>
:root{--bg:#eef1f6;--surface:#fff;--line:#d5dae3;--fg:#151a23;--mut:#5a6473;--acc:#2456d3;--acc-fg:#fff;--bad:#a61b1b;--bad-bg:#fde0e0;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1015;--surface:#171b23;--line:#313947;--fg:#edf0f5;--mut:#9ba5b4;--acc:#6b9bf5;--acc-fg:#0a1020;--bad:#ff8585;--bad-bg:#3f1719;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);padding:16px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:6px}
.wm{display:inline-flex;flex-direction:column;justify-content:center;line-height:1;padding-left:12px;border-left:3px solid var(--acc);border-radius:2px}
.wm1{font-size:11.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-top:3px;margin-bottom:1px}
.wm2{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--fg)}
p{color:var(--mut);margin:0 0 18px}label{display:block;margin:14px 0 5px;color:var(--mut);font-size:13px;font-weight:600}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit}
input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.chk{display:flex;align-items:center;gap:8px;margin:14px 0 0;color:var(--fg);font-size:14px;font-weight:400;cursor:pointer}.chk input{width:auto;margin:0}
button{width:100%;margin-top:20px;background:var(--acc);color:var(--acc-fg);border:0;padding:11px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{margin-top:14px;padding:9px 12px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:14px}
</style></head><body>
<form class="card" id="f">
 <div class="brand"><span class="wm" aria-label="Lieschen Müller"><span class="wm1">Lieschen</span><span class="wm2">Müller</span></span></div>
 <p>Bitte anmelden.</p>
 <label for="u">Benutzername</label><input id="u" name="username" autocomplete="username" autofocus required>
 <label for="p">Passwort</label><input id="p" name="password" type="password" autocomplete="current-password" required>
 <label class="chk" for="r"><input id="r" name="remember" type="checkbox"> Angemeldet bleiben (bis zu 90 Tage)</label>
 <button id="b" type="submit">Anmelden</button>
 <div class="err" id="e" hidden></div>
</form>
<script>
const f=document.getElementById("f"),e=document.getElementById("e"),b=document.getElementById("b");
f.addEventListener("submit",async ev=>{
 ev.preventDefault();e.hidden=true;b.disabled=true;
 try{
  const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:f.username.value.trim(),password:f.password.value,remember:f.remember.checked})});
  if(r.ok){location.replace("/");return}
  const d=await r.json().catch(()=>({}));e.textContent=d.detail||"Anmeldung fehlgeschlagen";e.hidden=false;f.password.value="";f.password.focus();
 }catch(x){e.textContent="Server nicht erreichbar";e.hidden=false}
 b.disabled=false;
});
</script></body></html>
